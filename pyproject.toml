[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drvec"
version = "0.1.0"
description = "VARMA-VEC cointegration models by exact maximum likelihood (Mauricio 2006): rank tests with a parametric bootstrap, restrictions, forecasts and impulse responses. The Python port of the ATSW suite's drvec, on drvarma's exact VARMA likelihood and fue's univariate models"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-2.0-or-later"
license-files = ["COPYING"]
authors = [
    { name = "David E. Guerrero", email = "davidesg@ucm.es" },
]
keywords = [
    "cointegration", "VECM", "VARMA", "VARMA-VEC", "error correction",
    "Johansen", "rank test", "bootstrap", "exact maximum likelihood",
    "time series", "econometrics", "Box-Jenkins", "forecasting",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
# Python; the platform wheels also carry drvec C as package data (setup.py,
# csrc/, [tool.cibuildwheel] below), for the bootstraps only. The numerics of
# the port that need to be fast live in the dependencies:
# drvarma's compiled exact likelihood (AS 311) and its optimiser, and fue's
# reader and univariate cast of the .pre files (fue.load, fue.cast_us: the
# series in levels with its deterministic component subtracted, as in
# drtran-python). fue >=0.1.18: the deterministic component by the suite's
# one routine (lib/fuedet), summed and subtracted once, as the oracle 0.13
# builds it. drvarma >=0.2.0: the first release whose binary wheels carry
# the engine on every platform, Windows included (BUG-0022). drvarma >=0.3.0:
# GSL's eigensolvers (gensymmv, eigen_nonsymm) from that engine, for
# Johansen's seed and the printed eigenvalues bit for bit with the C.
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "fue>=0.1.18",
    "drvarma>=0.3.0",
]

[project.scripts]
# NOT `drvec`: that is the C program's name on a system with the ATSW suite
drvec-py = "drvec.cli:main"

[project.urls]
Homepage = "https://github.com/davidesg/drvec-python"
Repository = "https://github.com/davidesg/drvec-python"
Issues = "https://github.com/davidesg/drvec-python/issues"
# The field PyPI shows highest: how the C was ported, decision by decision.
Documentation = "https://github.com/davidesg/drvec-python/blob/main/docs/PORT.md"
Changelog = "https://github.com/davidesg/drvec-python/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: a parametric bootstrap or a long search",
]

# ── The platform wheels: drvec C inside (PLAN-vec B5; publish.yml) ─────────
# One build per platform: the executable has no CPython ABI, and setup.py tags
# the wheel py3-none-<platform>. GSL is linked statically: on Linux and macOS
# built from source (tools/build_gsl.sh, GSL 2.7.1); on Windows MSYS2's, with
# its MinGW-w64 gcc (publish.yml sets DRVEC_CC and DRVEC_GSL_PREFIX).
# DRVEC_REQUIRE_C: a wheel without its binary fails the build. The smoke tests
# run in publish.yml's own jobs, which install fue and drvarma first.
[tool.cibuildwheel]
build = "cp312-*"
skip = "*-musllinux_* *-win32 *-manylinux_i686 pp*"
test-skip = "*"

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"
before-all = "bash {project}/tools/build_gsl.sh /tmp/gsl"
environment = { DRVEC_REQUIRE_C = "1", DRVEC_GSL_STATIC = "1", DRVEC_GSL_PREFIX = "/tmp/gsl" }

[tool.cibuildwheel.macos]
before-all = "bash {project}/tools/build_gsl.sh /tmp/gsl"
environment = { DRVEC_REQUIRE_C = "1", DRVEC_GSL_STATIC = "1", DRVEC_GSL_PREFIX = "/tmp/gsl" }

[tool.cibuildwheel.windows]
archs = ["AMD64"]
environment = { DRVEC_REQUIRE_C = "1", DRVEC_GSL_STATIC = "1" }
