name: fue and drvarma from git
description: >
  Before fue 0.1.18 and drvarma 0.3.0 are on PyPI, build them from their
  repositories at the given refs, with GSL from the platform's package manager
  (apt, Homebrew, vcpkg: as their own wheel builds get it). With both refs
  empty it does nothing, and pip takes them from PyPI. drvarma's engine is
  required (DRVARMA_REQUIRE_ENGINE): a failure to compile it stops here
  instead of a warning (drvarma BUG-0024).
inputs:
  fue_ref:
    description: "fue (davidesg/fue-python) at this ref; empty = PyPI"
    required: false
    default: ""
  drvarma_ref:
    description: "drvarma (davidesg/drvarma-python) at this ref; empty = PyPI"
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: GSL headers, to build them
      if: inputs.fue_ref != '' || inputs.drvarma_ref != ''
      shell: bash
      run: |
        case "${{ runner.os }}" in
          Linux)   sudo apt-get update -q && sudo apt-get install -y -q libgsl-dev ;;
          macOS)   brew install gsl ;;
          Windows) vcpkg install gsl:x64-windows-static-md ;;
        esac
    - name: fue and drvarma from git
      if: inputs.fue_ref != '' || inputs.drvarma_ref != ''
      shell: bash
      run: |
        python -m pip install --upgrade pip
        if [ "${{ runner.os }}" = Windows ]; then
          # where both build scripts look first (their cibuildwheel tables set it)
          export GSL_ROOT="$VCPKG_INSTALLATION_ROOT/installed/x64-windows-static-md"
        fi
        # -v: both engines are OPTIONAL extensions, and without it pip hides
        # why one did not compile.
        if [ -n "${{ inputs.fue_ref }}" ]; then
          python -m pip install -v "fue @ git+https://github.com/davidesg/fue-python@${{ inputs.fue_ref }}"
        fi
        if [ -n "${{ inputs.drvarma_ref }}" ]; then
          DRVARMA_REQUIRE_ENGINE=1 python -m pip install -v "drvarma @ git+https://github.com/davidesg/drvarma-python@${{ inputs.drvarma_ref }}"
        fi
        python -c "import fue, drvarma; print('fue', fue.__version__, '| drvarma', drvarma.__version__)"
