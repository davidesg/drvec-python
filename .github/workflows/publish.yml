name: Publish to PyPI

# Builds the sdist and the universal wheel, smoke-tests both, and publishes
# them on a v* tag. Launched by hand (workflow_dispatch) it builds and tests
# without publishing.
#
# The tag is `v*`, as in drtran-python, drvarma and fue: this repository holds
# one package, so its tags need no prefix. The prefixed tags of the suite name
# something inside a repository that holds more than one thing (atsw-gui's
# `drvec-v0.13` is the C program among the engines, the oracle of this port);
# a `drvec-v*` tag here would read as that program's.
#
# NO BINARY WHEELS, and that is correct: drvec is PURE PYTHON. It compiles
# nothing; the numerics that must be fast live in its dependencies, drvarma
# (the exact VARMA likelihood, the optimiser and GSL's eigensolvers) and fue
# (the reader and cast of the .pre files), which ship per-platform wheels.
# One `py3-none-any` wheel covers every platform.
#
# The smoke tests install from PyPI's dependencies: while fue 0.1.18 and
# drvarma 0.3.0 are not published they fail and the release stops. Better a
# blocked release than a package nobody can install (art-tseries 0.1.3).
#
# Auth: PyPI Trusted Publishing (OIDC), no API token in secrets.
# FIRST RELEASE ONLY: `drvec` does not exist on PyPI yet, so the publisher has
# to be registered as a PENDING publisher before the first tag:
# pypi.org -> Your account -> Publishing -> "Add a new pending publisher":
#     PyPI project name  drvec
#     owner              davidesg
#     repository         drvec-python
#     workflow           publish.yml
#     environment        pypi
# and the repository needs an environment named `pypi` (Settings ->
# Environments). Without the publisher the upload fails with "invalid or
# non-existent authentication information" and the tag has to be re-cut.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:      # manual run: build and smoke-test, no upload

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: The tag is the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          V=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$V" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != pyproject $V"; exit 1; }

      - name: Build
        run: |
          python -m pip install --upgrade build twine "packaging>=24.2"
          python -m build

      - name: Check the metadata
        # twine needs packaging>=24.2 for the PEP 639 License-Expression field
        # that setuptools>=77 writes.
        run: python -m twine check --strict dist/*

      - name: Nothing private in the sdist or the wheel
        run: |
          tar tzf dist/drvec-*.tar.gz | sort > sdist.txt
          python -m zipfile -l dist/drvec-*-py3-none-any.whl > wheel.txt
          cat sdist.txt
          # (`! grep` would not stop the step: bash -e ignores an inverted status)
          if grep -E 'PROCESOS|scratchpad|dolarization|\.venv|__pycache__|\.pyc$' sdist.txt wheel.txt; then
            echo "private or stray files in the distribution"; exit 1
          fi
          test "$(ls dist/*.whl | wc -l)" = 1
          ls dist/*-py3-none-any.whl

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # From the lowest Python declared to the latest: a single Python let a
  # sibling ship broken on 3.10 (drtran BUG-51).
  smoke:
    name: Smoke-test ${{ matrix.what }} (Python ${{ matrix.python-version }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        what: [wheel, sdist]
    steps:
      - uses: actions/checkout@v4        # the public fixtures (muskrat and mink)
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Install the ${{ matrix.what }} in a clean venv
        run: |
          python -m venv /tmp/clean
          if [ "${{ matrix.what }}" = wheel ]; then F=$(ls dist/drvec-*-py3-none-any.whl); \
          else F=$(ls dist/drvec-*.tar.gz); fi
          /tmp/clean/bin/pip install "$F"
      - name: Import, engines, a fit
        working-directory: /tmp
        run: |
          /tmp/clean/bin/python -c "import drvec; print('drvec', drvec.__version__)"
          /tmp/clean/bin/python -c "import drvarma._engine as E; b = E.engine_backend(); \
                     print('drvarma engine:', b); assert b == 'c', E.engine_load_error()"
          /tmp/clean/bin/python -c "from drvec._gsl import backend; b = backend(); \
                     print('eigensolver:', b); assert b == 'gsl'"
          /tmp/clean/bin/drvec-py -h > /dev/null
          F=$GITHUB_WORKSPACE/tests/data/fixtures
          /tmp/clean/bin/python -c "import drvec, math; \
                     r = drvec.fit(['$F/mmpre.muskrat.pre', '$F/mmpre.mink.pre'], 1, 0, 1); \
                     print('muskrat-mink VAR(1)-VEC r=1: logL', r.loglik); \
                     assert math.isfinite(r.loglik)"

  publish:
    name: Publish to PyPI
    needs: [build, smoke]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment: pypi
    permissions:
      id-token: write                   # required for Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: What is about to be published
        run: ls -la dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
