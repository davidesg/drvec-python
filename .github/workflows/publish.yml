name: Publish to PyPI

# Builds the platform wheels (drvec C inside, PLAN-vec B5), the pure-Python
# wheel and the sdist, smoke-tests every one of them, and publishes them on a
# v* tag. Launched by hand (workflow_dispatch) it builds and tests WITHOUT
# publishing: the publish job runs only on a tag.
#
# The tag is `v*`, as in drtran-python, drvarma and fue: this repository holds
# one package, so its tags need no prefix. The prefixed tags of the suite name
# something inside a repository that holds more than one thing (atsw-gui's
# `drvec-v0.13` is the C program among the engines, the oracle of this port);
# a `drvec-v*` tag here would read as that program's.
#
# THE WHEELS. drvec's Python is pure; what makes the platform wheels is drvec C
# itself, the port's oracle, shipped as package data (drvec/_bin/drvec, .exe on
# Windows) so that the bootstraps run on it (drvec.c_engine, engine="auto")
# without an ATSW install. It is built from the vendored sources (csrc/, their
# sha256 checked by tests/test_vendored.py) with GSL linked statically, so the
# executable needs only the C library. It is not an extension module and has
# no CPython ABI: one wheel per platform, tagged py3-none-<platform>, serves
# every Python (cibuildwheel builds it once, on cp312).
#   Linux x86_64 and aarch64  manylinux_2_28, GSL 2.7.1 built from source
#                             (tools/build_gsl.sh: the GSL the oracle runs on)
#   macOS arm64               the same GSL 2.7.1 from source, for macOS 14
#   Windows AMD64             MinGW-w64 gcc and GSL from MSYS2 (UCRT64), the
#                             toolchain ATSW builds drvec with, linked -static.
#                             BUILT BUT NOT PUBLISHED: drvec C 0.13's bootstrap
#                             never ends on Windows (its generator needs a
#                             64-bit unsigned long: bugs/drvec-c-rng-long32),
#                             so Windows gets the pure wheel and c_engine
#                             refuses 0.13 there. The job stays, so that the
#                             toolchain is proven for the fixed C; its
#                             artifact is not named wheels-*.
# DRVEC_REQUIRE_C=1 makes a failed C build fail the wheel, never a binary
# wheel without its binary. The pure wheel (DRVEC_NO_C=1, py3-none-any) is the
# fallback for every other platform, as in drvarma; the sdist builds the C
# when it finds a compiler and GSL, and goes without it otherwise.
#
# THE SMOKE TESTS install fue and drvarma from PyPI. While fue 0.1.18 and
# drvarma 0.3.0 are not published, a manual run gives git refs for them
# (inputs below, as tests.yml), built with GSL from each platform's package
# manager. On a tag the inputs are empty: PyPI, and the release stops if they
# are not there. Better a blocked release than a package nobody can install
# (art-tseries 0.1.3).
#
# Auth: PyPI Trusted Publishing (OIDC), no API token in secrets.
# FIRST RELEASE ONLY: `drvec` does not exist on PyPI yet, so the publisher has
# to be registered as a PENDING publisher before the first tag:
# pypi.org -> Your account -> Publishing -> "Add a new pending publisher":
#     PyPI project name  drvec
#     owner              davidesg
#     repository         drvec-python
#     workflow           publish.yml
#     environment        pypi
# and the repository needs an environment named `pypi` (Settings ->
# Environments). Without the publisher the upload fails with "invalid or
# non-existent authentication information" and the tag has to be re-cut.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:      # manual run: build and smoke-test, no upload
    inputs:
      fue_ref:
        description: "smoke tests: fue from git (davidesg/fue-python) at this ref; empty = PyPI"
        required: false
        default: "master"
      drvarma_ref:
        description: "smoke tests: drvarma from git (davidesg/drvarma-python) at this ref; empty = PyPI"
        required: false
        default: "gsl-gensymmv"

jobs:
  # ── Platform wheels: drvec C inside ───────────────────────────────────────
  build_wheels:
    name: Wheel — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest          # Linux x86_64
            archs: x86_64
          - os: ubuntu-24.04-arm       # Linux aarch64, native (no QEMU)
            archs: aarch64
          # macOS PINNED with its deployment target, as drvarma: a binary for
          # a newer macOS than the tag says is rejected by delocate.
          - os: macos-14               # macOS arm64
            archs: arm64
            macos_target: "14.0"
          - os: windows-latest         # Windows AMD64
            archs: AMD64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: MinGW-w64 gcc and GSL (Windows)
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-gsl
      - name: Point the build at them (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          U=$(cygpath -m "${{ steps.msys2.outputs.msys2-location }}/ucrt64")
          echo "DRVEC_CC=$U/bin/gcc.exe" >> "$GITHUB_ENV"
          echo "DRVEC_GSL_PREFIX=$U" >> "$GITHUB_ENV"
          "$U/bin/gcc.exe" --version | head -1
          ls "$U/lib/libgsl.a" "$U/lib/libgslcblas.a"

      # cibuildwheel's configuration is pyproject.toml's [tool.cibuildwheel]:
      # cp312 only, manylinux_2_28, GSL from source before all, DRVEC_REQUIRE_C.
      - name: Build the wheel
        uses: pypa/cibuildwheel@v2.22
        env:
          CIBW_ARCHS: ${{ matrix.archs }}
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_target }}

      - name: The wheel carries its binary, and it runs
        shell: bash
        run: |
          ls -la wheelhouse/
          python tools/check_wheel.py wheelhouse/*.whl

      - uses: actions/upload-artifact@v4
        with:
          # windows: not published (bugs/drvec-c-rng-long32)
          name: ${{ matrix.os == 'windows-latest' && 'unpublished-wheel-windows' || format('wheels-{0}', matrix.os) }}
          path: ./wheelhouse/*.whl

  # ── Pure-Python wheel and sdist ───────────────────────────────────────────
  build_pure:
    name: Pure wheel + sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: The tag is the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          V=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$V" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != pyproject $V"; exit 1; }

      - name: Build
        env:
          DRVEC_NO_C: "1"
        run: |
          python -m pip install --upgrade build twine "packaging>=24.2"
          python -m build

      - name: Check the metadata
        # twine needs packaging>=24.2 for the PEP 639 License-Expression field
        # that setuptools>=77 writes.
        run: python -m twine check --strict dist/*

      - name: Nothing private in the sdist or the wheel; csrc in the sdist, no binary in either
        run: |
          tar tzf dist/drvec-*.tar.gz | sort > sdist.txt
          python -m zipfile -l dist/drvec-*-py3-none-any.whl > wheel.txt
          cat sdist.txt
          # (`! grep` would not stop the step: bash -e ignores an inverted status)
          if grep -E 'PROCESOS|scratchpad|dolarization|\.venv|__pycache__|\.pyc$|_bin/' sdist.txt wheel.txt; then
            echo "private or stray files in the distribution"; exit 1
          fi
          grep -q 'csrc/VENDORED.json' sdist.txt
          grep -q 'csrc/engines/drvec/src/drvec.c' sdist.txt
          grep -q 'csrc/build_drvec.py' sdist.txt
          grep -q 'setup.py' sdist.txt
          test "$(ls dist/*.whl | wc -l)" = 1
          ls dist/*-py3-none-any.whl

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-pure
          path: dist/*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  # ── Smoke tests of the platform wheels: the bundled binary on the C path ──
  # From the lowest Python declared to the latest: a single Python let a
  # sibling ship broken on 3.10 (drtran BUG-51).
  smoke_wheels:
    name: Smoke ${{ matrix.os }} wheel (Python ${{ matrix.python }})
    needs: build_wheels
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # not windows-latest: its wheel is not published (above)
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-14]
        python: ["3.10", "3.13"]
    env:
      FUE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.fue_ref || '' }}
      DRVARMA_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.drvarma_ref || '' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4        # the tests and their public data
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/
      - uses: ./.github/actions/deps-from-git
        with:
          fue_ref: ${{ env.FUE_REF }}
          drvarma_ref: ${{ env.DRVARMA_REF }}
      - name: Install the wheel
        run: python -m pip install "$(ls wheelhouse/drvec-*.whl)" pytest
      - name: Import, engines, the bundled binary
        working-directory: ${{ runner.temp }}
        run: |
          python -c "import drvec; print('drvec', drvec.__version__, drvec.__file__)"
          python -c "import drvarma._engine as E; b = E.engine_backend(); \
                     print('drvarma engine:', b); assert b == 'c', E.engine_load_error()"
          python -c "from drvec._gsl import backend; b = backend(); \
                     print('eigensolver:', b); assert b == 'gsl'"
          python -c "from drvec import c_engine; b = c_engine.find(); print('drvec C:', b); \
                     assert b.source == 'bundled', b"
          drvec-py -h > /dev/null
      - name: A bootstrap through the bundled binary; the C path; the oracle's bytes on Linux x86_64
        env:
          DRVEC_TEST_INSTALLED: "1"
          DRVEC_REQUIRE_C: "1"
        run: |
          DRVEC_TEST_BIN=$(python -c "from drvec import c_engine; print(c_engine._bundled())")
          export DRVEC_TEST_BIN
          python -m pytest -q -rs -s tests/test_bundled.py tests/test_c_engine.py

  # ── Smoke tests of the pure wheel and the sdist ───────────────────────────
  smoke_pure:
    name: Smoke ${{ matrix.what }} (Python ${{ matrix.python }})
    needs: build_pure
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
        what: [pure-wheel, sdist]
    env:
      FUE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.fue_ref || '' }}
      DRVARMA_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.drvarma_ref || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.what == 'sdist' && 'sdist' || 'wheels-pure' }}
          path: dist/
      - uses: ./.github/actions/deps-from-git
        with:
          fue_ref: ${{ env.FUE_REF }}
          drvarma_ref: ${{ env.DRVARMA_REF }}
      - name: Install the ${{ matrix.what }}
        run: |
          if [ "${{ matrix.what }}" = sdist ]; then
            # the sdist builds drvec C from csrc/ (GSL headers are on the runner)
            sudo apt-get install -y -q libgsl-dev
            DRVEC_REQUIRE_C=1 python -m pip install -v dist/drvec-*.tar.gz pytest
          else
            python -m pip install dist/drvec-*-py3-none-any.whl pytest
          fi
      - name: Import, engines, a fit; the binary only from the sdist
        working-directory: /tmp
        run: |
          python -c "import drvec; print('drvec', drvec.__version__)"
          python -c "import drvarma._engine as E; b = E.engine_backend(); \
                     print('drvarma engine:', b); assert b == 'c', E.engine_load_error()"
          drvec-py -h > /dev/null
          F=$GITHUB_WORKSPACE/tests/data/fixtures
          python -c "import drvec, math; \
                     r = drvec.fit(['$F/mmpre.muskrat.pre', '$F/mmpre.mink.pre'], 1, 0, 1); \
                     print('muskrat-mink VAR(1)-VEC r=1: logL', r.loglik); \
                     assert math.isfinite(r.loglik)"
          if [ "${{ matrix.what }}" = sdist ]; then
            python -c "from drvec import c_engine; b = c_engine.find(); print('drvec C:', b); \
                       assert b.source == 'bundled', b"
          else
            python -c "from drvec import c_engine; assert c_engine._bundled() is None; \
                       print('pure wheel: no bundled binary;', c_engine.available())"
          fi
      - name: The bundled binary's tests (sdist) or their skips (pure wheel)
        env:
          DRVEC_TEST_INSTALLED: "1"
        run: |
          if [ "${{ matrix.what }}" = sdist ]; then export DRVEC_REQUIRE_C=1; fi
          python -m pytest -q -rs tests/test_bundled.py

  # ── Publish, only on a version tag ────────────────────────────────────────
  publish:
    name: Publish to PyPI
    needs: [build_wheels, build_pure, smoke_wheels, smoke_pure]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment: pypi
    permissions:
      id-token: write                   # required for Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "wheels-*"           # every wheels-<os> job plus wheels-pure
          merge-multiple: true
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist/
      - name: What is about to be published
        run: ls -la dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
