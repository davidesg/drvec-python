name: Tests

# The port against its oracle (drvec C 0.13, atsw-gui ae95446; csrc/ is 7ec4bf7,
# the same bytes on Linux with BUG-61 fixed), on the released
# fue (>= 0.1.18) and drvarma (>= 0.3.0), which come with the suite's release:
# the compiled likelihood and GSL's eigensolvers arrive with drvarma's binary
# wheels. The suite runs against the INSTALLED package (DRVEC_TEST_INSTALLED),
# not src/.
#
# BEFORE THAT RELEASE neither version is on PyPI, and a push or a pull request
# cannot pass. The manual run (workflow_dispatch) is the way to measure off the
# oracle's platform first: give it git refs and it builds fue and drvarma from
# their repositories, with GSL from each platform's package manager (as their
# own wheel builds get it: apt, Homebrew, vcpkg), instead of installing them
# from PyPI. fue's ref must carry 0.1.18 (its master does); drvarma's must
# carry 0.3.0 (the branch gsl-gensymmv, once pushed). drvec's own ref is the
# one the run is launched on.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      fue_ref:
        description: "fue from git (davidesg/fue-python) at this ref; empty = PyPI"
        required: false
        default: "master"
      drvarma_ref:
        description: "drvarma from git (davidesg/drvarma-python) at this ref; empty = PyPI"
        required: false
        default: "gsl-gensymmv"

jobs:
  test:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-14, windows-latest]
        python: ["3.10", "3.13"]
    env:
      FUE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.fue_ref || '' }}
      DRVARMA_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.drvarma_ref || '' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python }}"}

      - uses: ./.github/actions/deps-from-git
        with:
          fue_ref: ${{ env.FUE_REF }}
          drvarma_ref: ${{ env.DRVARMA_REF }}

      # drvec C, the oracle, built from the vendored sources (csrc/, checked
      # by tests/test_vendored.py against atsw-gui 7ec4bf7) into the package,
      # drvec/_bin, as the wheels carry it (PLAN-vec B5). REQUIRED on every
      # platform: on Linux and macOS with the system's GSL (static when its
      # archives are there), on Windows with MinGW-w64 gcc and MSYS2's GSL,
      # linked -static, as the Windows wheel (publish.yml). tests/
      # test_c_engine.py and tests/test_bundled.py then run on it -- on
      # ubuntu-latest, the oracle's platform, the C path equals the Python
      # path and the oracle's files byte for byte. Windows builds it again
      # since atsw-gui BUG-61 (bugs/drvec-c-rng-long32): before it, its
      # bootstrap never ended.
      - name: GSL for drvec C
        if: runner.os != 'Windows'
        run: |
          case "${{ runner.os }}" in
            Linux) sudo apt-get update -q && sudo apt-get install -y -q libgsl-dev ;;
            macOS) brew list gsl >/dev/null 2>&1 || brew install gsl ;;
          esac
      - name: MinGW-w64 gcc and GSL (Windows)
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-gsl
      - name: Point the build at them (Windows)
        if: runner.os == 'Windows'
        run: |
          U=$(cygpath -m "${{ steps.msys2.outputs.msys2-location }}/ucrt64")
          echo "DRVEC_CC=$U/bin/gcc.exe" >> "$GITHUB_ENV"
          echo "DRVEC_GSL_PREFIX=$U" >> "$GITHUB_ENV"
          echo "DRVEC_GSL_STATIC=1" >> "$GITHUB_ENV"
          "$U/bin/gcc.exe" --version | head -1
          ls "$U/lib/libgsl.a" "$U/lib/libgslcblas.a"
      - name: Install, with drvec C
        run: |
          export DRVEC_REQUIRE_C=1
          python -m pip install -v ".[test]" > "$RUNNER_TEMP/pip.log" 2>&1 || { tail -100 "$RUNNER_TEMP/pip.log"; exit 1; }
          grep -E "build_drvec|drvec C|DRVEC_NO_C" "$RUNNER_TEMP/pip.log" || true
      - name: The bundled binary
        working-directory: ${{ runner.temp }}
        run: |
          B=$(python -c "from drvec import c_engine; print(c_engine._bundled())")
          test -x "$B"
          "$B" --version
          echo "DRVEC_TEST_BIN=$B" >> "$GITHUB_ENV"
          echo "DRVEC_REQUIRE_C=1" >> "$GITHUB_ENV"
      - name: The engines are the compiled ones
        run: |
          python -c "import fue._engine as E; b = E.engine_backend(); print('fue engine:', b, E.engine_load_error() or '')"
          python -c "import drvarma._engine as E; b = E.engine_backend(); print('drvarma engine:', b); assert b == 'c', E.engine_load_error()"
      # GSL's eigensolvers come from drvarma's engine (>= 0.3.0) on every
      # platform: the port never looks for a system libgsl (the one installed
      # above is drvec C's).
      - name: Johansen's seed is GSL's
        run: python -c "from drvec._gsl import backend; b = backend(); print('drvec eigensolver:', b); assert b == 'gsl'"
      - name: Tests, against the installed package
        timeout-minutes: 60
        env:
          DRVEC_TEST_INSTALLED: "1"
        run: python -m pytest -q
